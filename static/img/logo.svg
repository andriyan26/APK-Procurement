<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
    <defs>
        <linearGradient id="logoPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        <linearGradient id="logoTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
        <linearGradient id="logoRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1d4ed8"/>
            <stop offset="100%" stop-color="#1e40af"/>
        </linearGradient>
    </defs>

    <!-- Icon Container Box -->
    <rect x="4" y="6" width="44" height="44" rx="12" fill="#1e293b"/>
    <rect x="4" y="6" width="44" height="44" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

    <!-- 3D Box Icon -->
    <polygon points="26,14 38,20 26,27 14,20" fill="url(#logoTopGrad)"/>
    <polygon points="14,20 26,27 26,42 14,35" fill="url(#logoPrimaryGrad)"/>
    <polygon points="26,27 38,20 38,35 26,42" fill="url(#logoRightGrad)"/>
    <path d="M20,27 L25,32 L34,22" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Brand Typography -->
    <text x="58" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="0.02em">
        PROCURE<tspan fill="#38bdf8">-APP</tspan>
    </text>
    <text x="58" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="0.14em">
        ENTERPRISE PROCUREMENT
    </text>
</svg>
