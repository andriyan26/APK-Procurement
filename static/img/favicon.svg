<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
        <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1d4ed8"/>
            <stop offset="100%" stop-color="#1e40af"/>
        </linearGradient>
        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
        </linearGradient>
        <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1d4ed8" flood-opacity="0.35"/>
        </filter>
    </defs>
    
    <!-- Background rounded squircle with subtle border -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#0f172a" filter="url(#shadowGlow)"/>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

    <!-- Dynamic glow inside -->
    <circle cx="32" cy="32" r="22" fill="url(#glowGrad)"/>

    <!-- Isometric 3D Procurement Box / Shield Node -->
    <!-- Top Face -->
    <polygon points="32,13 49,22 32,31 15,22" fill="url(#topGrad)"/>
    
    <!-- Left Face -->
    <polygon points="15,22 32,31 32,50 15,41" fill="url(#primaryGrad)"/>
    
    <!-- Right Face -->
    <polygon points="32,31 49,22 49,41 32,50" fill="url(#rightGrad)"/>
    
    <!-- Center Procurement Seam & Checkmark Accent -->
    <path d="M23,31 L30,38 L43,25" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
